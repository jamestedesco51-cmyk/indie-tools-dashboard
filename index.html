<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>indie.io — Inbound Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080c;
  --s1: #0d0e14;
  --s2: #111118;
  --s3: #16171f;
  --border: #1e1f2a;
  --border2: #2a2b38;
  --text: #e8e9f0;
  --muted: #4a4b5a;
  --muted2: #6a6b7a;
  --yes: #00e5a0;
  --no: #ff4d6d;
  --maybe: #f5a623;
  --purple: #a78bfa;
  --blue: #4d9fff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Syne", sans-serif; min-height: 100vh; }
.mono { font-family: "Geist Mono", monospace; }

/* Layout */
.layout { display: flex; height: 100vh; overflow: hidden; }
.rail { width: 56px; background: var(--s1); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 4px; flex-shrink: 0; }
.rail-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: var(--muted2); transition: all .15s; }
.rail-icon.active { background: rgba(0,229,160,.12); color: var(--yes); }
.rail-icon:hover:not(.active) { background: var(--s3); color: var(--text); }
.sidebar { width: 200px; background: var(--s1); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
.sidebar-logo { font-size: 13px; font-weight: 800; letter-spacing: .06em; color: var(--yes); }
.sidebar-sub { font-size: 10px; color: var(--muted2); font-family: "Geist Mono", monospace; margin-top: 2px; }
.sidebar-nav { padding: 8px; flex: 1; }
.nav-item { padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted2); display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.nav-item.active { background: rgba(0,229,160,.1); color: var(--yes); }
.nav-item:hover:not(.active) { background: var(--s3); color: var(--text); }
.nav-badge { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 10px; background: var(--s3); padding: 1px 6px; border-radius: 10px; }
.nav-item.active .nav-badge { background: rgba(0,229,160,.15); color: var(--yes); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Top bar */
.topbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--s1); flex-shrink: 0; }
.topbar-title { font-size: 14px; font-weight: 700; }
.topbar-sub { font-size: 11px; color: var(--muted2); font-family: "Geist Mono", monospace; }
.filter-bar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--s1); flex-shrink: 0; }
.filter-btn { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border2); background: transparent; color: var(--muted2); font-family: "Syne", sans-serif; transition: all .15s; }
.filter-btn.active { background: rgba(0,229,160,.1); color: var(--yes); border-color: rgba(0,229,160,.25); }
.search-input { margin-left: auto; padding: 4px 10px; border-radius: 6px; font-size: 11px; border: 1px solid var(--border2); background: var(--s2); color: var(--text); font-family: "Geist Mono", monospace; outline: none; width: 180px; }
.search-input::placeholder { color: var(--muted); }
.count-label { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--muted); }

/* Stats strip */
.stats-strip { display: flex; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stat-card { flex: 1; padding: 14px 16px; background: var(--s1); }
.stat-label { font-size: 9px; font-family: "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--muted2); margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 800; font-family: "Geist Mono", monospace; }
.stat-value.green { color: var(--yes); }
.stat-value.amber { color: var(--maybe); }
.stat-value.purple { color: var(--purple); }
.stat-value.blue { color: var(--blue); }

/* Queue */
.queue { overflow-y: auto; flex: 1; }
.queue-row { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 2px solid transparent; transition: all .1s; }
.queue-row:hover { background: var(--s2); }
.queue-row.expanded { background: var(--s2); border-left-color: var(--yes); }
.row-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.studio-name { font-size: 13px; font-weight: 700; }
.game-name { font-size: 11px; color: var(--muted2); }
.wl-badge { font-family: "Geist Mono", monospace; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px; }
.wl-hot { background: rgba(0,229,160,.12); color: var(--yes); }
.wl-warm { background: rgba(245,166,35,.12); color: var(--maybe); }
.wl-cold { background: var(--s3); color: var(--muted2); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }
.tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-family: "Geist Mono", monospace; }
.tag-blue { background: rgba(77,159,255,.12); color: var(--blue); }
.tag-purple { background: rgba(167,139,250,.15); color: var(--purple); }
.tag-green { background: rgba(0,229,160,.12); color: var(--yes); }
.tag-red { background: rgba(255,77,109,.12); color: var(--no); }
.row-meta { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--muted); }
.row-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.status-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; letter-spacing: .08em; text-transform: uppercase; font-family: "Geist Mono", monospace; }
.status-pending { background: rgba(245,166,35,.15); color: var(--maybe); border: 1px solid rgba(245,166,35,.3); }
.status-sent { background: rgba(0,229,160,.15); color: var(--yes); border: 1px solid rgba(0,229,160,.3); }
.expand-panel { padding: 14px 0 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-block { font-size: 11px; color: var(--muted2); line-height: 1.7; }
.detail-block strong { color: var(--text); }
.link-btn { display: inline-block; padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: 600; text-decoration: none; text-align: center; margin-bottom: 6px; }
.link-steam { background: rgba(77,159,255,.12); color: var(--blue); border: 1px solid rgba(77,159,255,.25); }
.link-deck { background: rgba(167,139,250,.12); color: var(--purple); border: 1px solid rgba(167,139,250,.25); }
.notes-block { grid-column: 1 / -1; font-size: 11px; color: var(--muted2); line-height: 1.6; background: var(--s3); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap; }

/* Overview */
.overview { padding: 20px; overflow-y: auto; flex: 1; }
.ov-section { margin-bottom: 24px; }
.ov-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted2); font-family: "Geist Mono", monospace; margin-bottom: 12px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kpi-card { background: var(--s2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.kpi-label { font-size: 9px; font-family: "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--muted2); margin-bottom: 8px; }
.kpi-val { font-size: 28px; font-weight: 800; font-family: "Geist Mono", monospace; }
.kpi-sub { font-size: 10px; color: var(--muted2); font-family: "Geist Mono", monospace; margin-top: 4px; }
.top-list { background: var(--s2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.top-row { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; }
.top-row:last-child { border-bottom: none; }
.top-studio { font-weight: 700; flex: 1; }
.top-game { color: var(--muted2); font-size: 11px; }
.top-wl { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--yes); }
.top-country { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--muted); }

.hidden { display: none !important; }
</style>
</head>

<div class="layout">
  <!-- Icon rail -->

    <div class="rail-icon" onclick="setView('inbound')" title="Inbound Queue">↓</div>

  <div class="sidebar">

  </div>
</div>

let currentFilter = 'all';
let currentSearch = '';
let expandedId = null;

function fmt(n) { return n != null ? Number(n).toLocaleString() : null; }

function wlClass(n) {
  if (!n) return 'wl-cold';
  if (n >= 10000) return 'wl-hot';
  if (n >= 1000) return 'wl-warm';
  return 'wl-cold';
}

function dateStr(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function setView(v) {
  document.getElementById('view-overview').classList.toggle('hidden', v !== 'overview');
  document.getElementById('view-inbound').classList.toggle('hidden', v !== 'inbound');
  document.getElementById('nav-overview').classList.toggle('active', v === 'overview');
  document.getElementById('nav-inbound').classList.toggle('active', v === 'inbound');
  document.querySelector('.rail-icon:nth-child(1)').classList.toggle('active', v === 'overview');
  document.querySelector('.rail-icon:nth-child(2)').classList.toggle('active', v === 'inbound');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

function doSearch(v) {
  currentSearch = v.toLowerCase();
  renderQueue();
}

function filteredRows() {
  return DATA.filter(r => {
    if (currentFilter === 'pending' && r.draft_sent) return false;
    if (currentFilter === 'sent' && !r.draft_sent) return false;
    if (currentSearch) {
      const hay = ((r.studio||'') + (r.game||'') + (r.full_name||'') + (r.country||'')).toLowerCase();
      if (!hay.includes(currentSearch)) return false;
    }
    return true;
  });
}

function renderQueue() {
  const rows = filteredRows();
  document.getElementById('row-count').textContent = rows.length + ' submission' + (rows.length !== 1 ? 's' : '');
  const list = document.getElementById('queue-list');
  list.innerHTML = rows.map(r => rowHtml(r)).join('');
}

function rowHtml(r) {
  const wl = r.wishlist_count;
  const expanded = expandedId === r.id;
  return `<div class="queue-row${expanded ? ' expanded' : ''}" onclick="toggleRow(${r.id})">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1">
        <div class="row-top">
          <span class="studio-name">${esc(r.studio || r.full_name)}</span>
          <span class="game-name">${esc(r.game || '')}</span>
          ${wl ? `<span class="wl-badge ${wlClass(wl)}">★ ${fmt(wl)}</span>` : ''}
        </div>
        <div class="tags">
          ${r.store_platform ? `<span class="tag tag-blue">${esc(r.store_platform)}</span>` : ''}
          ${r.has_pitch_deck ? `<span class="tag tag-purple">Deck</span>` : ''}
          ${r.console_interest ? `<span class="tag tag-green">Console</span>` : ''}
          ${r.funding_required === 'Yes' ? `<span class="tag tag-red">Funding</span>` : ''}
        </div>
        <div class="row-meta">${esc(r.country||'')}${r.team_size ? ' · ' + r.team_size + ' person team' : ''} · ${dateStr(r.received_at)}</div>
      </div>
      <div class="row-right">
        <span class="status-badge ${r.draft_sent ? 'status-sent' : 'status-pending'}">${r.draft_sent ? 'Sent' : 'Pending'}</span>
      </div>
    </div>
    ${expanded ? expandHtml(r) : ''}
  </div>`;
}

function expandHtml(r) {
  return `<div class="expand-panel">
    <div class="detail-block">
      <div><strong>Name</strong> &nbsp;${esc(r.full_name)}</div>
      <div><strong>Email</strong> &nbsp;${esc(r.email||'')}</div>
      ${r.country ? `<div><strong>Country</strong> &nbsp;${esc(r.country)}</div>` : ''}
      ${r.team_size ? `<div><strong>Team</strong> &nbsp;${r.team_size} people</div>` : ''}
      ${r.how_they_heard ? `<div><strong>Heard via</strong> &nbsp;${esc(r.how_they_heard)}</div>` : ''}
    </div>
    <div class="detail-block">
      ${r.store_url ? `<a href="${esc(r.store_url)}" target="_blank" class="link-btn link-steam">${esc(r.store_platform||'Store')} →</a><br>` : '<span style="color:var(--muted);font-size:11px">No store link</span>'}
      ${r.pitch_deck_url ? `<a href="${esc(r.pitch_deck_url)}" target="_blank" class="link-btn link-deck">Pitch Deck →</a>` : ''}
    </div>
    ${r.free_text_notes ? `<div class="notes-block">${esc(r.free_text_notes)}</div>` : ''}
  </div>`;
}

function toggleRow(id) {
  expandedId = expandedId === id ? null : id;
  renderQueue();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderOverview() {
  const pending = DATA.filter(r => !r.draft_sent).length;
  const withDeck = DATA.filter(r => r.has_pitch_deck).length;
  const withConsole = DATA.filter(r => r.console_interest).length;
  const withFunding = DATA.filter(r => r.funding_required === 'Yes').length;
  const top = DATA.filter(r => r.wishlist_count).sort((a,b) => b.wishlist_count - a.wishlist_count).slice(0,8);

  // Country breakdown
  const countries = {};
  DATA.forEach(r => { if (r.country) countries[r.country] = (countries[r.country]||0)+1; });
  const topCountries = Object.entries(countries).sort((a,b)=>b[1]-a[1]).slice(0,5);

  document.getElementById('overview-content').innerHTML = `
    <div class="ov-section">
      <div class="ov-title">Pipeline</div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Total Submissions</div>
          <div class="kpi-val" style="color:var(--yes)">${DATA.length}</div>
          <div class="kpi-sub">all time</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Pending Reply</div>
          <div class="kpi-val" style="color:var(--maybe)">${pending}</div>
          <div class="kpi-sub">awaiting outreach</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Have Pitch Deck</div>
          <div class="kpi-val" style="color:var(--purple)">${withDeck}</div>
          <div class="kpi-sub">${Math.round(withDeck/DATA.length*100)}% of submissions</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Console Interest</div>
          <div class="kpi-val" style="color:var(--blue)">${withConsole}</div>
          <div class="kpi-sub">Redhaven candidates</div>
        </div>
      </div>
    </div>
    <div class="ov-section">
      <div class="ov-title">Top Leads by Wishlist Count</div>
      <div class="top-list">
        ${top.map(r => `
          <div class="top-row">
            <div class="top-studio">${esc(r.studio||r.full_name)}</div>
            <div class="top-game">${esc(r.game||'')}</div>
            <div class="top-wl">★ ${fmt(r.wishlist_count)}</div>
            ${r.has_pitch_deck ? '<span class="tag tag-purple" style="font-size:8px">Deck</span>' : ''}
            ${r.console_interest ? '<span class="tag tag-green" style="font-size:8px">Console</span>' : ''}
            <div class="top-country">${esc(r.country||'')}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="ov-section">
      <div class="ov-title">Top Countries</div>
      <div class="top-list">
        ${topCountries.map(([c,n]) => `
          <div class="top-row">
            <div class="top-studio">${esc(c)}</div>
            <div style="font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted2)">${n} submission${n!==1?'s':''}</div>
            <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted)">${Math.round(n/DATA.length*100)}%</div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

// Init
document.getElementById('nav-inbound-count').textContent = DATA.filter(r=>!r.draft_sent).length;
renderOverview();
renderQueue();
</script>
